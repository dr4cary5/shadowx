<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShadowX</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #0a0a0a;
            color: #e0e0e0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            flex-direction: column;
            text-align: center;
        }
        h1 { color: #8a2be2; font-size: 2.5rem; margin-bottom: 1rem; }
        p { color: #888; max-width: 500px; line-height: 1.6; }
        .status { 
            margin-top: 2rem; 
            padding: 1rem 2rem; 
            background: #1a1a1a; 
            border-radius: 10px;
            border: 1px solid #333;
        }
    </style>
</head>
<body>
    <h1>🕶️ ShadowX</h1>
    <p>A development tool for testing serverless functions and edge caching behavior.</p>
    <div class="status">🚧 Staging Environment — Active Development</div>
</body>
</html>
